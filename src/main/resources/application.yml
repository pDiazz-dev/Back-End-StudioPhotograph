spring:
  application:
    name:
      StudioPhotografy

  datasource:
    url: jdbc:postgresql://localhost:5432/PhotographStudio
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    key:
      private: classpath:app.key
      public: classpath:app.pub